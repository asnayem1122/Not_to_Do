<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Shield Contour in Vibrant Indigo/Violet stroke -->
  <path d="M 32 18 C 22 18 18 24 18 36 L 18 56 C 18 74 38 88 50 94 C 62 88 82 74 82 56 L 82 40 C 82 37 79 35 76 37 C 73 39 73 42 73 44 L 73 56 C 73 70 57 82 50 86 C 43 82 27 70 27 56 L 27 36 C 27 29 29 27 34 27 L 62 27 C 65.5 27 67 24 65 21 C 63.5 19 60 18 56 18 Z" fill="#6366F1"/>
  
